name: Release

# 打 tag v* 即发版:构建 release APK 并创建 GitHub Release。
# App 内的「检查更新」只认本仓库(shuting52/shuiyingongju)的 Releases,
# 所以新版本要弹窗,必须走这个流程发 Release(光推代码不弹窗)。
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Flutter 版本与 ci.yml 钉住的一致(.flutter-version / 3.47.6)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6

      # lib/secrets.dart 不进版本库,模板足以编译
      - run: cp lib/secrets.example.dart lib/secrets.dart

      - run: flutter pub get

      # 正式签名:keystore 存在仓库 Secrets 里,所有版本共用同一签名,
      # 否则每次 CI 临时机器生成的 debug 签名都不同,覆盖安装会报"软件包冲突"。
      - name: 还原签名 keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.p12
          cat > android/key.properties <<EOF
          storeFile=release.p12
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 发布 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          APK="shuiyingongju-${VER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          # 重打同一 tag 时先删旧 Release,保证幂等(tag 的删建由人工操作,不在这里做,
          # 否则删 tag 重推会再次触发本 workflow 造成循环)。
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "APK 直装即可。更新通道:本仓库 Releases,App 启动时自动检查。"
